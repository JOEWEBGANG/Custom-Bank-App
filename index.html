<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank App</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- This is where you'll work -->
    <div id="app">Loading...</div>
    <template id="login">
      <h1>Zach's Styled Bank App</h1>
      <img src="img/oiia.gif" alt="spinning cat gif" id="logo">
      <section>
        <h2>Login</h2>
        <form id="loginForm">
          <label for="username">Username</label>
          <input id="username" name="user" type="text" placeholder="Enter your username" required />
          <a href="/dashboard" onclick="onLinkClick(event)">Login</a>
          <button>Login</button>
        </form>
        <hr />
        <h2>Register</h2>
        <form id="registerForm" action="javascript:register()">
            <label for="user">Username (required)</label>
            <input id="user" name="user" type="text" maxlength="20" placeholder="Create a username" required>
            <label for="currency">Currency (required)</label>
            <input id="currency" name="currency" type="text" value="$" maxlength="5" placeholder="$" required>
          <label for="description">Description</label>
          <input id="description" name="description" type="text" placeholder="account description" maxlength="100">
          <label for="balance">Current balance</label>
          <input id="balance" name="balance" type="number" placeholder="Balance" value="0" />
          <button>Register</button>
        </form>
      </section>
    </template>

    <template id="dashboard">
      <header>
        <h1>Bank App</h1>
        <a href="/login" onclick="onLinkClick(event)">Logout</a>
      </header>
      <section>Balance: 100$</section>
      <section>
        <h2>Transactions</h2>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Object</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </template>
  </body>
</html>
